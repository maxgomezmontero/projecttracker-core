name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: JS tests (extracted modules, CLI, fictional-data guard)
        run: npm test

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Python tests
        run: pytest
      - name: Offline run (rules call the real JS code; LLM replayed from results/cache; no API key)
        run: bench run --offline --on-cache-miss skip --results-dir ci-results --cache-dir results/cache
      - name: Committed results reproduce
        run: bench verify --results-dir results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t projecttracker-core .
      - run: docker run --rm projecttracker-core
