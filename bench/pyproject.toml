[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "projecttracker-bench"
version = "0.1.0"
description = "Benchmark: the ProjectTracker rules core (+ LLM + human review) vs a pure-LLM pipeline on synthetic engineering-document tasks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maximiliano Gomez Montero" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "matplotlib>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bench = "engbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/engbench/data/*.py" = ["E501"]  # template tables read better unwrapped
